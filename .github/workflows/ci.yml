name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seryvon
          POSTGRES_PASSWORD: seryvon
          POSTGRES_DB: seryvon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seryvon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SERYVON_DATABASE_URL: postgresql+psycopg://seryvon:seryvon@localhost:5432/seryvon
      SERYVON_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Type check with MyPy
        run: mypy src

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests and coverage
        run: |
          mkdir -p .tmp
          pytest \
            --junitxml=.tmp/pytest.xml \
            --cov-report=json:.tmp/coverage.json

      - name: Refresh landing metrics feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LANDING_CURRENT_RELEASE: v1.0-rc
        run: python scripts/generate_landing_metrics.py

      - name: Commit landing metrics feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/landing-metrics.json

          if git diff --cached --quiet; then
            echo "No landing metrics changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh landing metrics feed [skip ci]"
          git push
