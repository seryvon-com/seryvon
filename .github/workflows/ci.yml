name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Type check with MyPy
        run: mypy src

      - name: Run backend tests and coverage in the isolated Docker profile
        run: |
          docker compose --profile test build test
          docker compose --profile test run --rm --remove-orphans test \
            pytest -q \
              --junitxml=/tmp/pytest.xml \
              --cov-report=json:/tmp/coverage.json \
              --cov-fail-under=100

      - name: Verify generated quality metrics
        run: python scripts/generate_landing_metrics.py

      - name: Refresh landing metrics feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LANDING_CURRENT_RELEASE: v1.0-rc
        run: python scripts/generate_landing_metrics.py

      - name: Commit landing metrics feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/landing-metrics.json

          if git diff --cached --quiet; then
            echo "No landing metrics changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh landing metrics feed [skip ci]"
          git push
